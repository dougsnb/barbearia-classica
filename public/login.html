<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acesso — Barbearia Clássica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="/" class="brand-mark">Barbearia Clássica</a>
      <nav class="topnav" aria-label="Navegação">
        <a href="/">Início</a>
        <a href="/#servicos">Serviços</a>
      </nav>
      <div class="topbar-actions">
        <a href="/" class="btn btn-ghost btn-sm">Voltar à Vitrine</a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <section class="card auth-card stack-md" aria-label="Autenticação e cadastro">
      <div class="stack-sm">
        <span class="kicker">Portal de Acesso</span>
        <h1 class="section-title" id="auth-heading">Acesse sua conta</h1>
        <p class="muted-text">Entre para agendar e gerenciar seus horários ou crie sua conta gratuitamente.</p>
      </div>

      <div class="tabs" role="tablist" aria-label="Modo de acesso" style="width: 100%; display: grid; grid-template-columns: 1fr 1fr;">
        <button type="button" class="tab-btn active" id="tab-btn-login" role="tab" aria-selected="true">Entrar</button>
        <button type="button" class="tab-btn" id="tab-btn-cadastro" role="tab" aria-selected="false">Criar Conta</button>
      </div>

      <div id="auth-alert" class="alert-banner" role="alert"></div>

      <form id="form-login" class="stack-md" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-email">E-mail</label>
          <input class="input" type="email" id="login-email" name="email" placeholder="seu@email.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="login-senha">Senha</label>
          <input class="input" type="password" id="login-senha" name="senha" placeholder="Digite sua senha" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-submit-login">Entrar</button>
      </form>

      <form id="form-cadastro" class="stack-md" style="display: none;" novalidate>
        <div class="form-group">
          <label class="form-label" for="cad-nome">Nome completo</label>
          <input class="input" type="text" id="cad-nome" name="nome" placeholder="Ex.: João Pereira" required minlength="2" maxlength="100" autocomplete="name" />
        </div>
        <div class="form-group">
          <label class="form-label" for="cad-email">E-mail</label>
          <input class="input" type="email" id="cad-email" name="email" placeholder="seu@email.com" required maxlength="150" autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="cad-telefone">Telefone / WhatsApp</label>
          <input class="input" type="tel" id="cad-telefone" name="telefone" placeholder="(11) 99999-9999" maxlength="20" autocomplete="tel" />
        </div>
        <div class="form-group">
          <label class="form-label" for="cad-senha">Senha (mínimo 6 caracteres)</label>
          <input class="input" type="password" id="cad-senha" name="senha" placeholder="Crie uma senha segura" required minlength="6" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-submit-cadastro">Criar Conta</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">Barbearia Clássica — Sistema de Agendamento Online</div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
